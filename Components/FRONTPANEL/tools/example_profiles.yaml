# example_profiles.yaml -- front-panel profile configuration for fpprofile.py
#
#   python3 fpprofile.py example_profiles.yaml -o profiles.fpp
#   python3 fpprofile.py --dump profiles.fpp          (inspect a file)
#
# Copy profiles.fpp to the MiSTer SD card and select it with the OSD item
# "Front Panel Profiles".  Profiles that are not listed emit as the default
# profile: identity map, ON = #FF0001, OFF = #000009 (the hardware's own
# no-file defaults).  Unknown keys and bad values are errors.  The full
# semantics of every key live in fpprofile.md.
#
# This example describes the development panel: a 256-LED flexible matrix,
# 8 rows x 32 columns upright, wired from the top-left corner straight down
# column 0, serpentine into each next column (layout below).
#
# Capture chain (MicrocomputerZ80CPM.vhd, MSB first, CHAIN_BITS=384;
# full map: ../../../SIGNAL-CAPTURES.md):
#   0..7     fpLatch (port $FF style output latch), bit 7 first
#   8..23    address bus A15..A0
#   24..31   data bus D7..D0
#   32..39   A          40..47  F          48..55  A'        56..63  F'
#   64..71   B          72..79  C          80..87  B'        88..95  C'
#   96..103  D         104..111 E         112..119 D'       120..127 E'
#   128..135 H         136..143 L         144..151 H'       152..159 L'
#   160..175 IX       176..191 IY        192..207 PC       208..223 SP
#   224..251 mmu_phys_addr[27:0]
#   252..259 WR RD INT NMI BUSRQ M1 HALT BUSAK (active-high)
#   260..279 tied 0
#   280..283 WR RD MREQ IORQ strobes (stretched)
#   284..291 fpLatch again (bit 7 first)
#   292..383 headroom, reads 0 (no segment wired)

chain_bits: 384          # must match the FPGA CHAIN_BITS build
leds: 256                # matches the default FPGA NUM_LEDS
# dir: right             # run directions default to "right"; a profile-level
                         # `dir:` (see profile.2) or a per-run `dir:` wins

colors:                  # names usable anywhere a colour is accepted;
  heartbeat: "#FF2800"   # extend/override the built-in CSS/HTML names
  amber: "#FFBF00"       # (amber is not a CSS keyword -- define it once)

signals:                 # named chain groups; a definition may reference
  LATCH:  ["0..7"]       # only EARLIER symbols; repeats are allowed
  ADDR:   ["8..23"]      # A15..A0, chain order left to right
  DATA:   ["24..31"]     # D7..D0
  REG_AF: ["32..47"]     # A, F (current bank)
  REG_AP: ["48..63"]     # A', F'
  REG_BC: ["64..79"]
  REG_BCP: ["80..95"]
  REG_DE: ["96..111"]
  REG_DEP: ["112..127"]
  REG_HL: ["128..143"]
  REG_HLP: ["144..159"]
  IX:     ["160..175"]
  IY:     ["176..191"]
  PC:     ["192..207"]
  SP:     ["208..223"]
  STROBES: ["280..283"]  # WR RD MREQ IORQ (hardware-stretched)
  PTRS:   [IX, IY]                # composed of earlier symbols
  ALU_HDR: ["REG_AF[7..0]"]       # positional subset: A's 8 bits, MSB first

layout:                  # one global wiring description, all profiles
  rows: 8
  cols: 32
  origin: top-left       # the data feed corner
  major: column          # the string runs down columns...
  serpentine: true       # ...zig-zagging into each next column

defaults:
  on:  "#FF0001"         # same as the hardware's built-in colours
  off: "#000009"

signal_colors:           # colours that follow the SIGNAL, not the LED:
  PC:  {on: cyan}        #   every LED displaying the bit in every
  SP:  {on: magenta}     #   DEFINED profile gets these...
                         #   ...element/run placement colours still win
                         #   (see profile.0's amber run below)

profile.0:               # "everything in one frame" overview
  runs:
    - start: [0, 0]      # bus row: 8 + 16 + 8 = exactly 32 cells
      signals: [LATCH, ADDR, DATA]   # (dir omitted: defaults to right)
    - start: [1, 0]
      signals: [REG_AF, REG_AP]      # AF pair plus its shadow: 32 cells
    - start: [2, 0]
      signals: [REG_BC, REG_BCP]     # BC/BC' span exactly one row
    - start: [3, 0]
      signals: [REG_DE, REG_DEP]
    - start: [4, 0]
      signals: [REG_HL, REG_HLP]
    - start: [5, 0]
      signals: [IX, IY]              # 32 cells: the index registers
    - start: [6, 0]
      on: amber          # highlight the pointers against the default red
      signals: [PC, SP]              # 32 cells
    - start: [7, 0]
      signals:
        - STROBES                    # the four stretched bus strobes
        - {sig: "LATCH", on: teal}  # second latch copy, recoloured

profile.1:               # pointers and a recoloured data bus
  on: "#00FF40"          # profile colour: every run that doesn't override
  signal_colors:
    PC: {off: "#003040"} # per-profile overlay: PC's dark half only;
                          # its cyan ON still comes from the global table
  runs:
    - start: [0, 0]
      dir: right
      signals: [PTRS]                        # IX then IY, 32 cells
    - start: [1, 0]
      signals: [PC, SP]
    - start: [3, 0]
      signals:                            # per-element colours
        - {sig: "ADDR[7..0]", on: red, off: black}
        - "-"
        - {sig: DATA, on: heartbeat}
        - LATCH
    - start: [3, 25]     # packs into row 3 right where the run above
      dir: right         # stops (it claims 25 cells, cols 0..24)
      on: skyblue
      signals: ["8..14"] # claim is exactly the data: 7 cells, cols 25..31

profile.2:               # one vertical column, then a mixed row
  dir: right             # this profile's default direction...
  runs:
    - start: [7, 0]      # ...except the feed-corner column, upward
      dir: up
      on: red
      signals: ["ADDR[7..0]"]
    - start: [5, 2]      # dark "-" cells make readable gaps
      on: teal
      signals:
        - LATCH
        - {sig: "-", off: "#101010"}
        - LATCH
        - "-"
        - {sig: ALU_HDR, on: gold}
