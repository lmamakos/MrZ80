# profile.yaml -- front-panel profile configuration for fpprofile.py
#
#   python3 fpprofile.py profile.yaml -o profile.fpp
#   python3 fpprofile.py --dump profile.fpp            (inspect a file)
#
# Copy profile.fpp to the MiSTer SD card and select it with the OSD item
# "Front Panel Profiles".  Profiles that are not listed emit as the default
# profile: identity map, ON = #FF0001, OFF = #000009 (the hardware's own
# no-file defaults).  Unknown keys and bad values are errors.  The full
# semantics of every key live in fpprofile.md.
#
# This example describes the development panel: a 256-LED flexible matrix,
# 8 rows x 32 columns upright, wired from the top-left corner straight down
# column 0, serpentine into each next column (layout below).
#
# Capture chain (MicrocomputerZ80CPM.vhd, MSB first, CHAIN_BITS=384):
#   0..7     fpLatch (port $FF style output latch), bit 7 first
#   8..23    address bus A15..A0
#   24..31   data bus D7..D0
#   32..39   A          40..47  F          48..55  A'        56..63  F'
#   64..71   B          72..79  C          80..87  B'        88..95  C'
#   96..103  D         104..111 E         112..119 D'       120..127 E'
#   128..135 H         136..143 L         144..151 H'       152..159 L'
#   160..175 IX       176..191 IY        192..207 PC       208..223 SP
#   224..251 mmu_phys_addr[27:0]
#   252..259 WR RD INT NMI BUSRQ M1 HALT BUSAK (active-high)
#   260..279 tied 0
#   280..283 WR RD MREQ IORQ strobes (stretched)
#   284..291 fpLatch again (bit 7 first)
#   292..383 headroom, reads 0 (no segment wired)

chain_bits: 384          # matches the FPGA CHAIN_BITS build (384)
leds: 256                # matches the default FPGA NUM_LEDS
# dir: right             # run directions default to "right"; a profile-level
                         # `dir:` (see profile.2) or a per-run `dir:` wins

colors:                  # names usable anywhere a colour is accepted;
  heartbeat: "#FF2800"   # extend/override the built-in CSS/HTML names
  amber: "#FFBF00"       # (amber is not a CSS keyword -- define it once)

signals:                 # named chain groups; a definition may reference
  LATCH:  ["0..7"]       # only EARLIER symbols; repeats are allowed
  ADDR:   ["8..23"]      # A15..A0, chain order left to right
  DATA:   ["24..31"]     # D7..D0
  AF:     ["32..47"]
  BC:     ["64..79"]
  DE:     ["96..111"]
  HL:     ["128..143"]
  altAF:  ["48..63"]
  altBC:  ["80..95"]
  altDE:  ["112..127"]
  altHL:  ["144..159"]
  IX:     ["160..175"]
  IY:     ["176..191"]
  PC:     ["192..207"]
  SP:     ["208..223"]
  A:      ["AF[7..0]"]        # positional subset: A's 8 bits, MSB first
  FLAGS:  ["AF[15..8]"]
  WR:     [280]
  RD:     [281]
  MREQ:   [282]
  IORQ:   [283]
  INTREQ: [254]
  NMI:    [255]
  BUSREQ: [256]
  M1:     [257]
  HALT:   [258]
  BUSAK:  [259]
  PHYSADDR: ["224..251"]
  
layout:                  # one global wiring description, all profiles
  rows: 8
  cols: 32
  origin: top-left       # the data feed corner
  major: column          # the string runs down columns...
  serpentine: true       # ...zig-zagging into each next column

defaults:
  on:  "#FF0001"         # same as the hardware's built-in colours
  off: "#000000"

signal_colors:
  IORQ: { on: yellow }
  MREQ: { on: green  }
  RD:   { on: darkseagreen }
  WR:   { on: magenta }
  M1:   { on: darkblue }


profile.0:               # "everything in one frame" overview
  runs:
    - start: [0, 0]
      signals: [LATCH]   # (dir omitted: defaults to right)
    - start: [0, 16]
      signals: [A]
    - start: [0,24]
      signals: ["AF[8..15]"]

    - start: [1,0]
      signals: [altBC]
    - start: [1,16]
      signals: [BC]

    - start: [2,0]
      signals: [altDE]
    - start: [2,16]
      signals: [DE]

    - start: [3,0]
      signals: [altHL]
    - start: [3,16]
      signals: [HL]

    - start: [4,0]
      signals: [IX]
    - start: [4,16]
      signals: [SP]

    - start: [5,0]
      signals: [IY]
    - start: [5,16]
      signals: [PC]

    - start: [6,16]
      signals: [IORQ]
      on: red
    - start: [6,17]
      signals: [MREQ]
      on: red
    - start: [6,18]
      signals: [RD]
      on: red
    - start: [6,19]
      signals: [WR]
      on: red
    - start: [6,20]
      signals: [HALT]
      on: red
    - start: [6,21]
      signals: [M1]
      on: red
    - start: [6,22]
      signals: [BUSAK]
      on: red
    - start: [6,23]
      signals: [INTREQ]
      on: red
    - start: [6,24]
      signals: [DATA]

    - start: [7, 4]
      signals: [PHYSADDR]

      
profile.1:
  on:  "#F00000"
  off: "#000000"
  runs:
    - start: [0, 0]
      signals: [LATCH]   # (dir omitted: defaults to right)

    - start: [6,16]
      signals: [IORQ]
      on: red
    - start: [6,17]
      signals: [MREQ]
      on: red
    - start: [6,18]
      signals: [RD]
      on: red
    - start: [6,19]
      signals: [WR]
      on: red
    - start: [6,20]
      signals: [HALT]
      on: red
    - start: [6,21]
      signals: [M1]
      on: red
    - start: [6,22]
      signals: [BUSAK]
      on: red
    - start: [6,23]
      signals: [INTREQ]
      on: red

    - start: [6,24]
      signals: [DATA]
      on: red
    - start: [7, 4]
      signals: [PHYSADDR]
      on: red      
 
profile.2:
  on:  "#F00000"
  off: "#000000"
  runs:
    - start: [0, 0]
      signals: [LATCH]   # (dir omitted: defaults to right)

    - start: [6,16]
      signals: [IORQ]
    - start: [6,17]
      signals: [MREQ]
    - start: [6,18]
      signals: [RD]
    - start: [6,19]
      signals: [WR]
    - start: [6,20]
      signals: [HALT]
    - start: [6,21]
      signals: [M1]
    - start: [6,22]
      signals: [BUSAK]
    - start: [6,23]
      signals: [INTREQ]
    - start: [6,24]
      signals: [DATA]

    - start: [7, 4]
      signals: [PHYSADDR]
      
profile.3:               # pointers and a recoloured data bus
  on: "#00FF40"          # profile colour: every run that doesn't override
  runs:
    - start: [0, 0]
      dir: right
      signals: [IX, IY]                        # IX then IY, 32 cells
    - start: [1, 0]
      signals: [PC, SP]
    - start: [3, 0]
      signals:                            # per-element colours
        - {sig: "ADDR[7..0]", on: red, off: black}
        - "-"
        - {sig: DATA, on: heartbeat}
        - LATCH

profile.4:               # "everything in one frame" overview
  off: "#000003"
  on:  "#ff0400"  
  runs:
    - start: [0, 0]
      signals: [LATCH]   # (dir omitted: defaults to right)
    - start: [0, 16]
      signals: [A]
    - start: [0,24]
      signals: ["AF[8..15]"]

    - start: [1,0]
      signals: [altBC]
    - start: [1,16]
      signals: [BC]

    - start: [2,0]
      signals: [altDE]
    - start: [2,16]
      signals: [DE]

    - start: [3,0]
      signals: [altHL]
    - start: [3,16]
      signals: [HL]

    - start: [4,0]
      signals: [IX]
      on: blue
    - start: [4,16]
      signals: [SP]

    - start: [5,0]
      signals: [IY]
      on: amber
    - start: [5,16]
      signals: [PC]

    - start: [6,16]
      signals: [IORQ]
    - start: [6,17]
      signals: [MREQ]
    - start: [6,18]
      signals: [RD]
    - start: [6,19]
      signals: [WR]
    - start: [6,20]
      signals: [HALT]
    - start: [6,21]
      signals: [M1]
    - start: [6,22]
      signals: [BUSAK]
    - start: [6,23]
      signals: [INTREQ]
    - start: [6,24]
      signals: [DATA]
      on: green
    - start: [7, 4]
      signals: [PHYSADDR]
      on: violet

profile.5:               # one vertical column, then a mixed row
  dir: right             # this profile's default direction...
  runs:
    - start: [7, 0]      # ...except the feed-corner column, upward
      dir: up
      on: red
      signals: ["ADDR[7..0]"]
    - start: [5, 2]      # dark "-" cells make readable gaps
      on: teal
      signals:
        - LATCH
        - {sig: "-", off: "#101010"}
        - LATCH
        - "-"
        - {sig: A, on: gold}
